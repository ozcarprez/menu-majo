const $=id=>document.getElementById(id);
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const slug=s=>normalize(s).replace(/[^a-z0-9]+/g,'-').replace(/-$/,'');
const categoryId=c=>c.tipo+'-'+slug(c.categoria);
let meal='desayunos',current='todo',toastTimer;
function notice(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',5000)}
function textElement(tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;return el}
function syncUrl(){const u=new URL(location.href);u.hash=current==='todo'?meal:current;history.replaceState(null,'',u)}
function selectCategory(id,update=true){
 current=id;$('dishSearch').value='';$('clearSearch').hidden=true;$('searchStatus').textContent='';
 document.querySelectorAll('.dish').forEach(d=>d.hidden=false);
 document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===id)));
 document.querySelectorAll('.section').forEach(s=>s.hidden=s.dataset.meal!==meal||(id!=='todo'&&s.id!==id));
 if(update){syncUrl();$('menu').scrollIntoView({block:'start'})}
}
function renderCategories(){
 $('categories').replaceChildren();
 const cats=MENU.filter(c=>c.tipo===meal);
 [['todo','Todo',cats.reduce((n,c)=>n+c.platillos.length,0)],...cats.map(c=>[categoryId(c),c.categoria,c.platillos.length])].forEach(([id,name,count])=>{
 const b=textElement('button',name,'cat');b.dataset.category=id;b.append(textElement('span',String(count)));b.onclick=()=>selectCategory(id);$('categories').append(b);
 });
}
function selectMeal(value,id='todo',update=true){
 meal=value;
 document.querySelectorAll('.meal-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.meal===meal)));
 $('searchLabel').textContent='¿Qué se te antoja '+(meal==='desayunos'?'desayunar':'comer')+'?';
 $('dishSearch').placeholder=meal==='desayunos'?'Busca chilaquiles, huevos, café…':'Busca enchiladas, pescado, pasta…';
 renderCategories();selectCategory(id,false);if(update)syncUrl();
}
function readHash(){
 const hash=location.hash.slice(1);
 let cat=MENU.find(c=>categoryId(c)===hash);
 // Keep links shared before the breakfast/lunch split working.
 if(!cat)cat=MENU.find(c=>slug(c.categoria)===hash);
 selectMeal(cat?cat.tipo:(hash==='comidas'?'comidas':'desayunos'),cat?categoryId(cat):'todo',false);
}
function render(){
 MENU.forEach((c,i)=>{
 const section=document.createElement('section');section.className='section';section.id=categoryId(c);section.dataset.meal=c.tipo;section.setAttribute('aria-labelledby',section.id+'-title');
 const heading=document.createElement('div');heading.className='section-head';const title=textElement('h2',c.categoria);title.id=section.id+'-title';
 heading.append(title,textElement('span',c.tipo==='desayunos'?'DESAYUNOS':'COMIDAS','section-index'));section.append(heading);
 if(c.subtitle)section.append(textElement('p',c.subtitle,'subtitle'));
 const dishes=document.createElement('div');dishes.className='dishes';
 c.platillos.forEach(p=>{const article=document.createElement('article');article.className='dish';article.append(textElement('h3',p.nombre));if(p.desc)article.append(textElement('p',p.desc));dishes.append(article)});
 section.append(dishes);$('menu').append(section);
 });
 readHash();
}
function shareUrl(){const u=new URL(location.href);u.search='';return u.href}
async function copyLink(){try{await navigator.clipboard.writeText(shareUrl());notice('Enlace copiado. Pégalo en tu publicación o mensaje.')}catch{window.prompt('Copia este enlace para compartir el menú:',shareUrl())}}
function applySearch(){
 const query=normalize($('dishSearch').value.trim());$('clearSearch').hidden=!query;
 if(!query){selectCategory(current,false);return}
 document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed','false'));
 let count=0;
 document.querySelectorAll('.section').forEach(section=>{
 if(section.dataset.meal!==meal){section.hidden=true;return}
 let visible=0;
 section.querySelectorAll('.dish').forEach(dish=>{const match=normalize(dish.textContent).includes(query);dish.hidden=!match;if(match)visible++});
 section.hidden=visible===0;count+=visible;
 });
 $('searchStatus').textContent=count?count+' platillo'+(count===1?'':'s')+' encontrado'+(count===1?'':'s')+' en '+meal:'No encontramos ese platillo en '+meal+'. Prueba con otro nombre o cambia de menú.';
}
$('copy').onclick=copyLink;
window.addEventListener('hashchange',readHash);
document.querySelectorAll('.meal-btn').forEach(b=>b.onclick=()=>selectMeal(b.dataset.meal));
$('dishSearch').addEventListener('input',applySearch);
$('clearSearch').onclick=()=>{selectCategory('todo',false);$('dishSearch').focus()};
render();
