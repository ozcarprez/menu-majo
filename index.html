<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú - Restaurante Majo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0a0a;
    color: #e8e4df;
    min-height: 100vh;
  }

  .hero {
    text-align: center;
    padding: 32px 20px 24px;
    background: #6b6b6b;
  }

  .hero-logo-img {
    max-width: 280px;
    width: 80%;
    margin-bottom: 16px;
  }

  .hero p {
    color: #ccc;
    font-size: 14px;
  }

  .hero .direccion {
    color: #aaa;
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.5;
  }

  /* CATEGORÍAS */
  .categorias {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    background: #0a0a0a;
    z-index: 50;
    border-bottom: 1px solid #1a1a1a;
  }

  .categorias::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #888;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .cat-btn.active {
    background: #5ba88c;
    border-color: #5ba88c;
    color: #fff;
    font-weight: 600;
  }

  /* CONTENIDO */
  .menu-content {
    padding: 8px 16px 140px;
    max-width: 520px;
    margin: 0 auto;
  }

  .cat-section { display: none; }
  .cat-section.active { display: block; }

  .cat-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    padding: 20px 0 4px;
  }

  .cat-subtitle {
    font-size: 12px;
    color: #5ba88c;
    margin-bottom: 12px;
    font-style: italic;
  }

  /* PLATILLO */
  .platillo {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid #141414;
    align-items: center;
  }

  .platillo-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: #141414;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .platillo-info { flex: 1; min-width: 0; }

  .platillo-name {
    font-size: 15px;
    font-weight: 600;
    color: #eee;
    margin-bottom: 2px;
  }

  .platillo-desc {
    font-size: 12px;
    color: #555;
    line-height: 1.3;
  }

  .platillo-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .add-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid #333;
    background: transparent;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .add-btn:hover { background: #5ba88c; border-color: #5ba88c; }

  .cantidad-inline {
    display: none;
    align-items: center;
    gap: 6px;
  }
  .cantidad-inline.show { display: flex; }

  .qi-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid #333;
    background: transparent;
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qi-btn:hover { background: #5ba88c; border-color: #5ba88c; }

  .qi-num {
    font-size: 15px; font-weight: 700; color: #fff;
    width: 18px; text-align: center;
  }

  /* CARRITO */
  .carrito-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #25D366;
    padding: 16px 20px;
    display: none;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    z-index: 100;
  }
  .carrito-bar.show { display: flex; }

  .carrito-left { display: flex; align-items: center; gap: 12px; }

  .carrito-count {
    background: rgba(0,0,0,0.2);
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }

  .carrito-text { font-weight: 600; font-size: 16px; color: #fff; }
  .carrito-items-text { font-size: 13px; color: rgba(255,255,255,0.8); }

  .carrito-wa { display: flex; align-items: center; gap: 6px; }
  .carrito-wa svg { width: 20px; height: 20px; fill: #fff; }
  .carrito-wa span { font-weight: 700; font-size: 15px; color: #fff; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: #141414;
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 520px;
    max-height: 85vh; overflow-y: auto;
    padding: 24px 20px 32px;
  }

  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }

  .modal-title { font-size: 20px; font-weight: 700; color: #fff; }

  .modal-close {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid #333; background: transparent;
    color: #888; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .resumen-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #1e1e1e;
  }

  .resumen-item-left { display: flex; align-items: center; gap: 10px; }

  .resumen-qty {
    background: #1e3a2f; color: #5ba88c;
    font-weight: 700; font-size: 13px;
    padding: 3px 8px; border-radius: 6px;
  }

  .resumen-name { font-size: 14px; color: #ddd; }

  .resumen-divider { height: 1px; background: #222; margin: 16px 0; }

  .modal .field { margin-bottom: 14px; }

  .modal label {
    display: block; font-size: 13px; font-weight: 600;
    color: #888; margin-bottom: 6px;
  }

  .modal input, .modal textarea {
    width: 100%; padding: 12px 14px;
    background: #0a0a0a; border: 1px solid #2a2a2a;
    border-radius: 10px; color: #fff; font-size: 16px;
    font-family: 'DM Sans', sans-serif;
  }

  .modal textarea { resize: none; height: 60px; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: #5ba88c; }
  .modal input::placeholder, .modal textarea::placeholder { color: #444; }

  .btn-send {
    width: 100%; padding: 16px;
    background: #25D366; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 8px;
  }

  .btn-send svg { width: 20px; height: 20px; fill: currentColor; }

  .tipo-pedido {
    display: flex; gap: 8px; margin-bottom: 14px;
  }

  .tipo-btn {
    flex: 1; padding: 10px; border-radius: 10px;
    border: 1.5px solid #2a2a2a; background: transparent;
    color: #888; font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    text-align: center; transition: all 0.2s;
  }

  .tipo-btn.active {
    border-color: #5ba88c; background: #1e3a2f; color: #5ba88c; font-weight: 600;
  }
</style>

  // =============================================
  // LÓGICA
  // =============================================

  const carrito = {};

  function renderMenu() {
    const categoriasDiv = document.getElementById('categorias');
    const contentDiv = document.getElementById('menuContent');

    categoriasDiv.innerHTML = `<button class="cat-btn active" onclick="filtrar('todo')">Todo</button>`;

    MENU.forEach((cat, i) => {
      categoriasDiv.innerHTML += `<button class="cat-btn" onclick="filtrar('${i}')">${cat.emoji} ${cat.categoria}</button>`;

      let html = `<div class="cat-section active" data-cat="${i}">`;
      html += `<div class="cat-title">${cat.emoji} ${cat.categoria}</div>`;
      if (cat.subtitle) {
        html += `<div class="cat-subtitle">${cat.subtitle}</div>`;
      }

      cat.platillos.forEach((p, j) => {
        const id = `${i}-${j}`;
        html += `
          <div class="platillo">
            <div class="platillo-info">
              <div class="platillo-name">${p.nombre}</div>
              ${p.desc ? `<div class="platillo-desc">${p.desc}</div>` : ''}
            </div>
            <div class="platillo-right">
              <button class="add-btn" id="add-${id}" onclick="agregar('${p.nombre.replace(/'/g, "\\'")}', '${id}')">+</button>
              <div class="cantidad-inline" id="qi-${id}">
                <button class="qi-btn" onclick="quitarUno('${p.nombre.replace(/'/g, "\\'")}', '${id}')">−</button>
                <span class="qi-num" id="qn-${id}">0</span>
                <button class="qi-btn" onclick="agregar('${p.nombre.replace(/'/g, "\\'")}', '${id}')">+</button>
              </div>
            </div>
          </div>`;
      });

      html += `</div>`;
      contentDiv.innerHTML += html;
    });
  }

  function filtrar(cat) {
    document.querySelectorAll('.cat-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (cat === 'todo' && i === 0) || cat === String(i - 1));
    });
    document.querySelectorAll('.cat-section').forEach(sec => {
      if (cat === 'todo') sec.classList.add('active');
      else sec.classList.toggle('active', sec.dataset.cat === cat);
    });
  }

  function agregar(nombre, id) {
    if (!carrito[nombre]) carrito[nombre] = { cantidad: 0 };
    carrito[nombre].cantidad++;
    document.getElementById(`add-${id}`).style.display = 'none';
    document.getElementById(`qi-${id}`).classList.add('show');
    document.getElementById(`qn-${id}`).textContent = carrito[nombre].cantidad;
    actualizarCarrito();
  }

  function quitarUno(nombre, id) {
    if (!carrito[nombre]) return;
    carrito[nombre].cantidad--;
    if (carrito[nombre].cantidad <= 0) {
      delete carrito[nombre];
      document.getElementById(`add-${id}`).style.display = 'flex';
      document.getElementById(`qi-${id}`).classList.remove('show');
    } else {
      document.getElementById(`qn-${id}`).textContent = carrito[nombre].cantidad;
    }
    actualizarCarrito();
  }

  function actualizarCarrito() {
    let totalItems = 0;
    for (const key in carrito) totalItems += carrito[key].cantidad;

    const bar = document.getElementById('carritoBar');
    bar.classList.toggle('show', totalItems > 0);
    document.getElementById('carritoCount').textContent = totalItems;
    document.getElementById('carritoItemsText').textContent = `${totalItems} producto${totalItems !== 1 ? 's' : ''}`;
  }

  function setTipo(btn, tipo) {
    tipoPedido = tipo;
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function abrirResumen() {
    const itemsDiv = document.getElementById('resumenItems');
    let html = '';
    for (const nombre in carrito) {
      html += `
        <div class="resumen-item">
          <div class="resumen-item-left">
            <span class="resumen-qty">${carrito[nombre].cantidad}x</span>
            <span class="resumen-name">${nombre}</span>
          </div>
        </div>`;
    }
    itemsDiv.innerHTML = html;
    document.getElementById('modalOverlay').classList.add('show');
  }

  function cerrarResumen() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function enviarWhatsApp() {
    const nombre = document.getElementById('nombre').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const notas = document.getElementById('notas').value.trim();

    if (!nombre) { alert('Escribe tu nombre'); return; }
    if (!telefono) { alert('Escribe tu teléfono'); return; }

    let lista = '';
    for (const key in carrito) {
      lista += `   • ${carrito[key].cantidad}x ${key}\n`;
    }

    let mensaje = `🍽️ *Pedido - Restaurante Majo*\n\n`;
    mensaje += `📋 *Orden:*\n${lista}\n`;
    mensaje += `📍 *Tipo:* ${tipoPedido === 'comer aqui' ? 'Comer en restaurante' : 'Para llevar'}\n\n`;
    mensaje += `👤 *Nombre:* ${nombre}\n`;
    mensaje += `📱 *Tel:* ${telefono}\n`;
    if (notas) mensaje += `📝 *Notas:* ${notas}\n`;
    mensaje += `\n¡Gracias!`;

    const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
    cerrarResumen();
  }

  renderMenu();
</script>
